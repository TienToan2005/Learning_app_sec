spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appsec_db
    driver-class-name: org.postgresql.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
jwt:
  secret-key: "my-super-secret-key-must-be-at-least-256-bits-long-for-hs256"
  expiration-key: 3600000