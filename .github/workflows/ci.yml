name: CI/CD Pipeline — AppSec

# Khi nào pipeline chạy?
on:
  push:
    branches: [ main, develop ]   # Push lên main hoặc develop
  pull_request:
    branches: [ main ]             # Tạo Pull Request vào main

jobs:

  # ===== JOB 1: BUILD & TEST =====
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest         # Chạy trên máy ảo Ubuntu của GitHub

    steps:
      # Bước 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven              # Cache Maven dependencies → Build nhanh hơn

      # Bước 3: Build và chạy Unit Test
      - name: Build with Maven
        run: mvn clean package

      # Bước 4: Upload file .jar (để job sau dùng)
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ===== JOB 2: SECURITY SCAN =====
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test          # Chạy SAU khi build thành công

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scan dependency vulnerabilities (Log4Shell, Spring4Shell...)
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'AppSec'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 7
            --enableRetired

      # Upload báo cáo bảo mật
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()               # Upload dù pass hay fail
        with:
          name: security-report
          path: reports/

  # ===== JOB 3: BUILD DOCKER IMAGE =====
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: security-scan           # Chạy SAU khi scan bảo mật pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t appsec-app:${{ github.sha }} .
        #                              ↑ Tag bằng commit hash → Unique mỗi build